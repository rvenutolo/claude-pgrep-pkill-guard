name: setup
# Caller must run harden-runner and actions/checkout before this
# composite: a local action cannot perform its own initial checkout.
description: Install Nix and restore the Nix store cache.
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3  # v3.24.1
      with:
        # Turns off the installer's diagnostics. They go to
        # install.determinate.systems, the host the installer is downloaded from,
        # so the harden-runner allowlist cannot separate them from the download.
        diagnostic-endpoint: ''
      env:
        # Turns off the action's OpenTelemetry export. Its collector,
        # otel.determinate.systems, is not on harden-runner's egress
        # allowlist, so each phase of the action -- and each `nix` it runs to
        # probe the store, which inherits the exporter settings -- waits out
        # a blocked connection before giving up. macOS drops the blocked DNS
        # lookup rather than refusing it, so there each wait is a full
        # resolver timeout. Nothing reads that telemetry.
        OTEL_SDK_DISABLED: 'true'
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
      with:
        # `-v2-` is a generation marker, not tidiness. Garbage collection (below)
        # runs only when the save phase finds no cache under the primary key,
        # so a cache saved under a key without the marker would be restored and
        # never replaced, and the GC setting would be dead config for it. Bump
        # the marker whenever a change to this action must invalidate every
        # cache it ever saved.
        primary-key: nix-${{ runner.os }}-v2-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-v2-
        # Collect ALL garbage before saving. Without this the cache is the
        # union of every store the runner ever restored: a flake.lock bump
        # restores the previous lock's store through the prefix match, adds
        # the new closures next to the old ones, and saves the lot. Left to
        # grow, successive lock bumps took the macOS store to 12.1 GB nar for
        # a devShell whose runtime closure is 3.2 GB, and the 2.9 GB tarball
        # took `gtar` 8m51s to extract on every run of every PR -- two thirds
        # of the leg.
        #
        # `0` rather than a byte ceiling: anything rooted survives GC
        # regardless (see the step below), so a ceiling could only ever keep
        # garbage, and the right amount of garbage is none.
        gc-max-store-size: 0
    - name: Root the devShell so garbage collection keeps it
      # `nix develop` roots nothing: the shell's closure is garbage the moment
      # the command exits, and the GC configured above would delete the very
      # store paths the cache exists to carry. `--profile` writes a profile,
      # and a profile is a garbage-collection root, so this is what makes the
      # runtime closure -- and only the runtime closure -- survive to the
      # save. The gate's later `nix develop` runs reuse the same derivation.
      #
      # RUNNER_TEMP rather than the workspace: a profile symlink under the
      # checkout would be an untracked file in the tree the gate grades.
      #
      # Flake inputs (the nixpkgs source tree among them) are NOT rooted and
      # are collected, so the next run re-fetches them from cache.nixos.org.
      # Carrying them in the tarball does not pay: the nixpkgs tree is over a
      # hundred thousand small files, and `gtar` extracting them adds as much
      # to the restore as substituting them costs `nix develop` on Linux, and
      # about twice as much on macOS.
      shell: bash
      run: nix develop --profile "${RUNNER_TEMP}/devshell-profile" --command true
