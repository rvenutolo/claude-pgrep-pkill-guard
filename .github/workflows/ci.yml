name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Every `compat (...)` job below tests against the runner image's AMBIENT
  # tools by design, and GitHub rolls those images roughly weekly. Without a
  # scheduled run the suite can go red in a week nobody pushed, and the breakage
  # then surfaces on the next PR looking like that PR's fault. The hermetic
  # `checks` and `gate` jobs are pinned by flake.lock so an image roll cannot
  # move them, but they still depend on cache.nixos.org and the Nix installer,
  # which this covers too. GitHub emails the repo owner when a scheduled
  # workflow fails, so a red run is not silent even with nobody watching
  # Actions.
  #
  # :47 rather than :00 -- on-the-hour cron slots are the most contended on
  # GitHub's shared scheduler, and therefore the most delayed. The minute
  # differs from links.yml's :17 on purpose: both workflows want the same
  # Monday-noon window, and there is nothing to gain from having them queue for
  # runners at the same instant.
  schedule:
    - cron: '47 12 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  # `github.event_name` belongs in this key, not just workflow + ref. A
  # scheduled run's `github.ref` is refs/heads/main -- indistinguishable from a
  # push to main -- so without the event name a Monday-noon scheduled run and a
  # push landing in the same window share a group, and `cancel-in-progress`
  # kills one of them. That would most often kill the scheduled run, which is
  # exactly the run nobody is watching and the only one that catches an ambient
  # regression. With the event name in the key, push still cancels push (the
  # whole point of the group) and a schedule can no longer be cancelled by
  # unrelated traffic.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    # The half of run-all-checks whose verdict cannot differ between platforms
    # -- formatting, the governance lints, the lint suite -- runs once, on Linux,
    # rather than on every gate leg. It reports in a few minutes, so a lint or
    # governance failure surfaces long before the suite finishes. The gate legs
    # run the other half.
    runs-on: ubuntu-latest
    # The warm run is ~2 min; 15 leaves room for a cold Nix store while still
    # failing a hang early.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Bench freshness is a release-time property: .ci/check-bench-fresh warns
      # on stale numbers everywhere and convicts only when this is set, which
      # is on release-please's branch alone. A release with stale figures is
      # red until `just bench` runs on main and merges; an ordinary hooks/ PR
      # is not asked to pay a wall-clock benchmark.
      BENCH_FRESH_STRICT: ${{ github.head_ref == 'release-please--branches--main' && '1' || '' }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443
            install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
            releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history, not actions/checkout's default depth of 1. This job
          # runs .ci/check-bench-fresh, which asks git whether hooks/ has moved
          # since the commit bench/RESULTS.md was generated at -- a question a
          # shallow clone cannot answer. The check skips rather than fails when
          # the recorded commit is missing, so at depth 1 it would skip on every
          # CI run and the check would be theatre.
          fetch-depth: 0
          persist-credentials: false
      # Benign `./`: the checkout above is this workflow's own commit, so `$/`
      # would resolve the same tree. Full rationale at the gate job's
      # `uses: ./.github/actions/setup` (#137).
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
      - name: Run the shared checks
        # See the gate job's gate step for why the interpreter is the flake's bash.
        shell: nix develop --command bash -e {0}
        run: ./.ci/in-devshell ./run-all-checks --scope=shared

  gate:
    name: gate (${{ matrix.os }}${{ matrix.slice && format(', {0}', matrix.slice) || '' }})
    # The platform-sensitive half of run-all-checks: the suite, under the leg's
    # awk, and the checks whose verdict depends on the host -- see
    # run-all-checks' --scope. The checks job runs the rest once.
    runs-on: ${{ matrix.os }}
    # The slowest leg's warm-cache run is ~6 min (a macOS slice). A flake.lock
    # bump misses the Nix cache, which adds a slow macOS setup and a slow
    # post-step cache save to that slice; 15 covers both while still failing a
    # hang early.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One awk per platform, so no leg pays for the suite twice: gawk on
        # Linux, and one-true-awk on macOS, where it is the stock awk. A local
        # run-all-checks, the pre-push hook's included, runs both.
        #
        # macOS is split across runners by run-all-checks' --slice, because its
        # leg is otherwise the slowest job in CI: each slice runs its share of
        # the files, weighed by run-tests' FILE_WEIGHTS, and slice 0 also runs
        # the platform checks. Every extra runner pays the Nix setup again, so
        # Linux, which finishes sooner, stays one leg. ci-ok needs `gate` as a
        # whole, so a slice added or removed here needs no ruleset change.
        include:
          - os: ubuntu-latest
            awk: gawk
          - os: macos-latest
            awk: bwk
            slice: 0/2
          - os: macos-latest
            awk: bwk
            slice: 1/2
    steps:
      # harden-runner is Linux-only, so it cannot be "first in every job" here.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443
            install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
            releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # zizmor's `self-repository` audit, new in 1.30.0, asks that a local
      # composite action be reached through GitHub's `$/` form rather than the
      # path-relative `./`, so it resolves at the commit the workflow is
      # running rather than out of whatever the working tree happens to hold.
      # The concern it exists for is a job that checks out a ref it does not
      # control and then runs an action from it.
      #
      # `$/` is not adoptable yet. No released actionlint parses it -- it
      # rejects every one of these lines with "invalid format because ref is
      # missing" -- and actionlint runs one linter EARLIER than zizmor in
      # .ci/run-lint-checks, so converting the call sites would trade this
      # audit for a hard parse error on every one of them. Upstream support is
      # an open, unmerged pull request against rhysd/actionlint. Every one of
      # these suppressions lifts when it ships (#137).
      #
      # Here, at the checks job above, at the compat legs below and in
      # links.yml, the checkout immediately above is this workflow's own
      # commit, so `./` and `$/` resolve to the same tree and the audit has
      # nothing to bite on.
      # The one site in this repo where the forms genuinely differ is
      # release.yml's `release-please` job; the rationale lives there, next to
      # it.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
      - name: Run the platform gate
        # The gate is run under a bash from the repo's own flake, not the host's.
        # .ci/in-devshell runs BEFORE the devShell it creates, so it executes
        # under whatever bash the host provides -- and macOS ships 3.2, which
        # has no `shopt -s inherit_errexit`. That option is load-bearing for
        # every gate script (without it errexit never reaches inside $(...), so
        # a failing helper is silently swallowed and the gate exits 0), so the
        # job must not drop it; on a stock runner .ci/in-devshell's version guard
        # exits 1 before that `shopt` line is ever reached.
        #
        # `nix develop --command bash` rather than `brew install bash`: Homebrew
        # would add an unpinned dependency and a second network path (it already
        # failed here once on a transient pkg-containers DNS error), whereas the
        # flake is pinned by flake.lock and ./.github/actions/setup has just
        # installed Nix. The INNER in-devshell run is --ignore-environment all
        # the same, so the hermetic boundary is unaffected -- this only chooses
        # the interpreter that reads the entrypoint script.
        #
        # .ci/in-devshell carries an explicit `bash >= 4.4` guard, so a
        # coworker running `just check` on a stock Mac gets an actionable
        # sentence instead of the raw shopt error. This job selects the flake's
        # bash all the same, because the point here is to RUN the gate, not to
        # rediscover that the host bash is too old.
        shell: nix develop --command bash -e {0}
        # RUNNER_TEMP rather than a path in the workspace: a report directory
        # written under the checkout would be an untracked file in the tree the
        # gate grades. It is already in .ci/in-devshell's KEEP_VARS, so it
        # resolves to the same path inside and outside the hermetic boundary.
        #
        # The awk and the slice arrive through env rather than a `${{ }}`
        # expansion inside `run:`, which zizmor flags as template injection
        # whatever the source. A leg with no slice passes no --slice.
        env:
          GATE_AWK: ${{ matrix.awk }}
          GATE_SLICE: ${{ matrix.slice }}
        run: |
          slice_args=()
          if [[ -n "${GATE_SLICE}" ]]; then
            slice_args=(--slice "${GATE_SLICE}")
          fi
          ./.ci/in-devshell ./run-all-checks --scope=platform --awk="${GATE_AWK}" "${slice_args[@]}" \
            --report "${RUNNER_TEMP}/bats-junit"
      # if: failure() -- the report is only interesting when something went red,
      # and uploading ~22 KB of green XML on every push is noise. run-all-checks
      # writes a gawk/ or bwk/ subdirectory, named for the leg's awk (#83).
      # The name must be unique across the whole workflow run: two legs
      # uploading `bats-junit-gate` would collide. The OS alone is not unique
      # once a platform is sliced, and the slice itself holds a `/`, which an
      # artifact name may not, so the leg's matrix index completes it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: bats-junit-gate-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bats-junit
          retention-days: 7

  coverage:
    name: coverage
    # Linux only: nixpkgs' kcov names no darwin platform at all, so the devShell
    # does not carry it on macos-latest and `run-tests --coverage` would die
    # there by design (#91).
    #
    # Its own job, in parallel with the gate, rather than a step after the gate:
    # the kcov run is a full extra pass of the suite, and as a step it would add
    # its whole length to the Linux gate leg. It is also a SEPARATE run of the
    # suite rather than a wrapper around the gate's own, so the gate's
    # authoritative pass/fail never depends on kcov working: a kcov regression
    # -- or a nixpkgs bump that breaks its bash support -- would otherwise read
    # as a test failure and send the next reader into hooks/.
    runs-on: ubuntu-latest
    # About twice the job's ~6 min run, rounded up to fail a hang early.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443
            install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
            releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Benign `./`: the checkout above is this workflow's own commit, so `$/`
      # would resolve the same tree. Full rationale at the gate job's
      # `uses: ./.github/actions/setup` (#137).
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
      - name: Measure hook line coverage
        # See the gate job's gate step for why the interpreter is the flake's bash.
        shell: nix develop --command bash -e {0}
        # RUNNER_TEMP, not the workspace: a report written under the checkout
        # would be an untracked tree in the repo the suite runs from. It is
        # already in .ci/in-devshell's KEEP_VARS, so it names the same path on
        # both sides of the hermetic boundary.
        #
        # stderr goes to a file, and only surfaces if the step fails. kcov's
        # bash tracing forwards every trace line it cannot parse -- the
        # continuation lines of any multi-line traced command, of which the
        # suite's JSON payloads produce a great many -- to its own stderr. That
        # spill would bury the run in the job log. bats writes its TAP to
        # STDOUT, so the test results themselves are unaffected and stay
        # visible; only the trace spill is captured.
        run: |
          ./.ci/in-devshell ./run-tests --coverage "${RUNNER_TEMP}/coverage" \
            2> "${RUNNER_TEMP}/coverage-stderr.log" || {
            echo '::group::coverage run stderr (last 200 lines)'
            tail --lines=200 "${RUNNER_TEMP}/coverage-stderr.log"
            echo '::endgroup::'
            exit 1
          }
      - name: Summarise coverage
        shell: nix develop --command bash -e {0}
        # .ci/report-coverage reads the merged report run-tests writes, fails
        # loudly when it is absent or incomplete, and writes the summary itself.
        # GITHUB_STEP_SUMMARY is in KEEP_VARS, so it survives
        # --ignore-environment.
        run: ./.ci/in-devshell ./.ci/report-coverage "${RUNNER_TEMP}/coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        # Not `if: failure()`, unlike the gate's JUnit upload: the coverage
        # figures ARE the deliverable, wanted on every green run. The HTML is
        # ~1.4 MB and is the part worth reading -- the per-line hit counts,
        # which the job summary's single percentage cannot carry.
        with:
          name: coverage-html
          path: ${{ runner.temp }}/coverage
          retention-days: 7

  commitlint:
    name: commitlint
    # pull_request ONLY: default merge-commit subjects ("Merge pull request #1
    # ...") are not conventional and would redden main on the first merge.
    # release-please still reads the branch commits for its changelog.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443 auth.docker.io:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443
            production.cloudflare.docker.com:443 registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1

  compat-linux:
    name: compat (ubuntu, ambient)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Report the ambient toolchain
        run: |
          set -Eeuo pipefail
          bash --version | head -1
          jq --version
          # Which awk this runner actually provides is an assumption worth
          # printing: the image may resolve `awk` to gawk or to mawk. The
          # scanner depends on nothing awk-specific, and the hermetic gate
          # proves that under one-true-awk too, but the ambient flavour still
          # belongs in the log when a run goes red.
          command -v awk
          awk --version 2>&1 | head -1 || awk -W version 2>&1 | head -1
      # Benign `./`: the checkout above is this workflow's own commit, so `$/`
      # would resolve the same tree. Full rationale at the gate job's
      # `uses: ./.github/actions/setup` above (#137).
      - uses: ./.github/actions/bats-ambient  # zizmor: ignore[self-repository]
      - name: Run the suite against ambient tools
        run: ./run-tests --report "${RUNNER_TEMP}/bats-junit"
      # See the gate job's upload step for why this only fires on failure (#83).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: bats-junit-compat-ubuntu
          path: ${{ runner.temp }}/bats-junit
          retention-days: 7

  compat-macos-brew-bash:
    name: compat (macos, homebrew bash)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install a modern bash
        # bash is the ONLY macOS prerequisite. Stock awk is one-true-awk, and
        # since #7 the scanner depends on nothing awk-specific, so this leg runs
        # the suite against /usr/bin/awk on purpose: it is exactly what a
        # coworker's Mac looks like after the README's `brew install bash`.
        run: brew install bash
      - name: Report the ambient toolchain
        run: |
          set -Eeuo pipefail
          brew_prefix="$(brew --prefix)"
          "${brew_prefix}/bin/bash" --version | head -1
          jq --version
          /usr/bin/awk --version 2>&1 | head -1
      # Benign `./`: the checkout above is this workflow's own commit, so `$/`
      # would resolve the same tree. Full rationale at the gate job's
      # `uses: ./.github/actions/setup` above (#137).
      - uses: ./.github/actions/bats-ambient  # zizmor: ignore[self-repository]
      - name: Run the suite against ambient tools
        run: |
          set -Eeuo pipefail
          brew_prefix="$(brew --prefix)"
          # Put Homebrew's bash ahead of /bin/bash so the hook's shebang picks it
          # up. Nothing is put ahead of /usr/bin/awk.
          export PATH="${brew_prefix}/bin:${PATH}"
          # Fail loudly here rather than letting the suite pass for the wrong
          # reason if the runner image ever starts shipping gawk first.
          command -v awk
          [ "$(command -v awk)" = /usr/bin/awk ]
          awk --version 2>&1 | head -1
          bash --version | head -1
          ./run-tests --report "${RUNNER_TEMP}/bats-junit"
      # See the gate job's upload step for why this only fires on failure (#83).
      # This leg runs no harden-runner -- the action is Linux-only -- so nothing
      # in its egress path needs allowlisting.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: bats-junit-compat-macos-brew
          path: ${{ runner.temp }}/bats-junit
          retention-days: 7

  compat-macos-stock-bash:
    name: compat (macos, stock bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Assert the guard deactivates loudly
        run: ./.ci/check-inactive-on-old-bash

  validate:
    name: validate
    # Outside the devShell on purpose: the Claude Code CLI is a Node package,
    # and adding it as a flake input would pull a large dependency into every
    # `just check` for a check that only matters at submission time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The pin is load-bearing, not tidiness. `--strict` treats an UNKNOWN
      # field as an error, so a Claude Code release that renames or deprecates a
      # manifest field would redden main on a day nothing here changed. Pinned,
      # that release arrives as a renovate PR that goes red instead.
      # renovate: datasource=npm depName=@anthropic-ai/claude-code
      CLAUDE_CODE_VERSION: '2.1.304'
      # The CLI validates manifests entirely offline -- verified with an empty
      # HOME, which produced no login prompt and wrote no config. These keep it
      # from trying anything else under a blocking egress policy.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
      DISABLE_ERROR_REPORTING: '1'
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443 registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Claude Code CLI
        # The runner's bundled Node is used as-is. actions/setup-node would mean
        # one more SHA to pin and one more thing to bump for no gain here.
        #
        # zizmor's adhoc-packages is suppressed here, and only here: the version
        # is not ad-hoc at all. CLAUDE_CODE_VERSION is pinned in this job's `env`
        # and Renovate bumps it, which is the property a lockfile would buy --
        # see that env key's own comment for why the pin is load-bearing rather
        # than tidy. The suppression sits on the `run:` key because zizmor reads
        # YAML comments: a `#` inside the block scalar is part of the shell
        # script, not a comment zizmor can see, and is silently ignored.
        run: |  # zizmor: ignore[adhoc-packages]
          set -Eeuo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          # Load-bearing, not a courtesy echo: the npm package ships a
          # bin/claude.exe stub that exit 1s when its native optional
          # dependency is skipped, so this is what turns a stubbed install
          # into a red job instead of a `plugin validate` step that silently
          # validates nothing.
          claude --version
      - name: Validate both manifests
        # Both files by name. `claude plugin validate <directory>` resolves to
        # the marketplace manifest only and never reaches plugin.json.
        run: |
          set -Eeuo pipefail
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json

  ci-ok:
    name: ci-ok
    # The one check the `protect-main` ruleset requires. Every other job feeds
    # it through `needs`, so jobs can be added, split or renamed here without
    # editing the ruleset.
    #
    # always(): without it a failed or cancelled dependency would skip this
    # job, and a skipped required check counts as passing.
    if: always()
    needs:
      - checks
      - gate
      - coverage
      - commitlint
      - compat-linux
      - compat-macos-brew-bash
      - compat-macos-stock-bash
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          # No network calls: the job only inspects its own `needs` context.
          allowed-endpoints: ''
      - name: Require every needed job to have succeeded
        # commitlint is pull_request-only, so `skipped` is its normal result on
        # a push. Any other skipped job, and every cancelled or failed one,
        # fails the check.
        run: |
          set -Eeuo pipefail
          # Assigned on its own line, not read through process substitution:
          # a jq failure there would leave the loop empty and the job green.
          results="$(jq --raw-output 'to_entries[] | [.key, .value.result] | @tsv' <<< "${NEEDS_JSON}")"
          [[ -n "${results}" ]]
          failed=0
          while IFS=$'\t' read -r job result; do
            printf '%s: %s\n' "${job}" "${result}"
            case "${job}:${result}" in
              *:success | commitlint:skipped) ;;
              *) failed=1 ;;
            esac
          done <<< "${results}"
          exit "${failed}"
