name: Links
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Link rot does not correlate with pushes: a URL dies when somebody else's
  # server changes, in a week nobody touched this repo. The weekly run is what
  # actually catches it. GitHub emails the repo owner when a scheduled workflow
  # fails, so a red run is not silent even with nobody watching Actions.
  #
  # :17 rather than :00 -- on-the-hour cron slots are the most contended on
  # GitHub's shared scheduler, and therefore the most delayed.
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  # `github.event_name` belongs in this key for the same reason it does in
  # ci.yml. A scheduled run's `github.ref` is refs/heads/main, indistinguishable
  # from a push to main, so without the event name the Monday-noon run and a
  # push landing in the same window share a group and `cancel-in-progress` kills
  # one of them -- usually the scheduled one, which is the run that exists to
  # catch link rot in a week nobody pushed.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  links:
    name: links
    # Deliberately NOT a required status check, and it must not become one.
    # Link rot is caused by the internet, not by the pull request: a required
    # `links` context would let a third party's expired certificate block an
    # unrelated merge. The job still runs on every PR and reddens visibly, it
    # just cannot gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The token exists to raise GitHub's API rate limit, not to write.
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # TODO: restore egress-policy block once block mode stops dropping allowed hosts on
          # westus2 runners: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
      - name: Check every link in the tracked tree
        # In the environment, never in argv: a token passed as a flag is visible
        # in `ps` output for the life of the process. lychee reads GITHUB_TOKEN
        # natively, and .ci/check-links passes it through the same way.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.ci/in-devshell ./.ci/check-links
