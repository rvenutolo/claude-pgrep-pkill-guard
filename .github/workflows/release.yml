name: Release
on:
  push:
    branches: [main]
  # The escape hatch. The App wiring cannot be fully proven until it runs — the
  # APP_PRIVATE_KEY secret cannot be read back — and without a manual trigger
  # the only way to retry a failed release job is an empty commit on main.
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # 20, not 10: this job now installs Nix to reformat release-please's output.
    timeout-minutes: 20
    permissions:
      # The App installation token does every write. The ambient GITHUB_TOKEN
      # needs no scopes beyond reading this repo.
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          # Same allowlist as ci.yml's gate job, which already proves it covers
          # a Nix install plus the GitHub API.
          #
          # No blank line may follow this folded scalar. yamlfmt's
          # retain_line_breaks sentinel (`#magic___^_^___line`) leaks INTO the
          # scalar when one does, and harden-runner splits allowed-endpoints on
          # a literal space, so the sentinel would become a junk endpoint and
          # the egress allowlist would be silently wrong. ci.yml has no blank
          # line there either, for the same reason.
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443
            install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443
            releases.nixos.org:443 tarballs.nixos.org:443
      # Pull requests created with the default GITHUB_TOKEN do not trigger
      # workflows, so the release PR would never run the six required status
      # checks and could only be merged by admin bypass. An App installation
      # token is a real actor and its events do trigger workflows.
      #
      # `client-id`, not `app-id`: v3.2.0 deprecates the latter and annotated
      # every release run to say so (#41). The Client ID is a DIFFERENT value
      # from the App ID -- same App, newer identifier -- so this needed the
      # APP_CLIENT_ID secret before it could be swapped. APP_ID is deliberately
      # left in place as a working fallback until a dispatched run proves this
      # mints a token; this step is the first thing after harden-runner, so a
      # wrong id fails here with a 401 before release-please runs at all, and
      # nothing has to be unwound.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Two annotations on this step are known, benign, and NOT worth
      # rediagnosing a third time (#41):
      #
      # 1. `Node.js 20 is deprecated ... forced to run on Node.js 24`. Upstream's
      #    to fix; renovate tracks the action, so it resolves on a version bump.
      # 2. `Error: unexpected token ' ' at 1:6, valid tokens [(, !, :]`, twice.
      #    That is the conventional-commit parser rejecting two commit subjects,
      #    named in the log as 45020ec and d55f280 -- both merges carrying
      #    GitHub's default `Merge pull request #N from ...` subject. `Merge` is
      #    five characters, so the space lands at column 6 where a scope, a `!`
      #    or the type's `:` was expected. Both predate the current practice of
      #    rewriting merge subjects to `type: subject (#N)`, and both sit after
      #    the v1.0.0 tag, which is where release-please starts reading -- so
      #    they leave the window at the next release and cannot recur while
      #    merge subjects stay conventional. Nothing to fix.
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445  # v4.2.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please re-serialises every file it touches, and two of this
      # repo's own gates then reject the result: prettier collapses the
      # `keywords` array it expands in the plugin and marketplace manifests, and
      # markdownlint's MD012 rejects the double blank lines it writes into the
      # changelog. Left alone, merging the release PR turns main red. So the
      # release branch is reformatted in place before anyone can merge it.
      #
      # This cannot loop: the reformat lands on the release branch, and this
      # workflow fires only on push to main. It DOES re-trigger ci.yml through
      # the PR's synchronize event, which is the entire point.
      - name: Check out the release branch
        if: steps.release.outputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          # The fetch credential, and only that. Nothing here pushes any more --
          # the reformat is committed through the GitHub API (see the next step)
          # -- so no git remote helper on the runner ever needs this token, and
          # the checkout matches every other one in this repo.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        if: steps.release.outputs.pr != ''

      # The reformat is committed through the GitHub API, not `git commit` +
      # `git push`. `protect-main` has `required_signatures`, and nothing on the
      # runner holds a signing key, so a pushed commit arrives unsigned and the
      # ruleset refuses the merge -- the release PR sits at `BLOCKED` with every
      # required check green (#70). It recurred on every single release. GraphQL
      # `createCommitOnBranch`, called with the App installation token, produces
      # a commit GitHub signs on the App's behalf: same content, same bot, valid
      # signature. It is the same mechanism that makes release-please's own
      # commit acceptable.
      #
      # That also makes the old GIT_AUTHOR_*/GIT_COMMITTER_* env block dead
      # config, so it is gone: the API attributes the commit to the token's
      # actor, which is that same bot.
      - name: Apply repo formatting to the generated files
        if: steps.release.outputs.pr != ''
        shell: bash
        env:
          # Interpolated into env:, never into the run: body -- the standing
          # untrusted-input discipline across this repo's workflows, which
          # zizmor enforces.
          BRANCH: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          # Byte-for-byte the subject the old `git commit` used: conventional,
          # so the PR's commitlint check stays green.
          HEADLINE: 'chore: apply repo formatting to the release-please output'
          # The App installation token is what makes the commit a signed one.
          # It survives `nix develop --ignore-environment` because GH_TOKEN is
          # in .ci/in-devshell's KEEP_VARS allowlist.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -Eeuo pipefail
          # treefmt handles the JSON manifests. It does not touch markdown at
          # all, so the changelog needs markdownlint's own fixer.
          nix fmt
          if [[ -f CHANGELOG.md ]]; then
            # --fix exits non-zero if anything is left unfixable. Let that fail
            # the job: a residual lint error here is a red main after merge.
            nix develop --command markdownlint-cli2 --fix CHANGELOG.md
          fi
          # Staged first, then compared: the payload builder reads the INDEX, so
          # what is staged here is exactly what the mutation sends.
          git add --all
          if git diff --cached --quiet HEAD; then
            echo 'release-please output already matches repo formatting'
            exit 0
          fi
          git status --short
          # Through .ci/in-devshell, like every other gate tool in this repo: a
          # gate never resolves its tools from the ambient PATH. Two evaluations
          # rather than one nested `bash -c` -- the Nix store is warm by this
          # point and readability wins.
          #
          # The payload pins expectedHeadOid to the HEAD just checked out. If
          # the release branch moved under the job, the mutation fails loudly
          # and this job goes red. Deliberate: there is no retry and no force
          # path, because a branch that moved means the tree that was formatted
          # is not the tree being committed to, and guessing is worse than
          # stopping.
          payload="$(.ci/in-devshell .ci/build-commit-payload \
            "${GITHUB_REPOSITORY}" "${BRANCH}" "${HEADLINE}")"
          printf '%s' "${payload}" | .ci/in-devshell gh api graphql --input -
